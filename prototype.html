    <div class="notice" style="margin-top:8px">Купоны прогнозистов с кнопкой «Повторить» приходят в ленту</div></div>`);
  tp.querySelectorAll('.f2').forEach(b=>b.onclick = ()=>{
    const n = b.dataset.n, i = S.follows.indexOf(n);
    if(i<0){ S.follows.push(n); b.classList.add('on'); b.textContent = '✓'; toast(`Теперь следишь за ${esc(n)}`, 'good', '👀'); bump('социальное', 2); }
    else { S.follows.splice(i,1); b.classList.remove('on'); b.textContent = 'Следить'; }
    store.save(); syncTop();
  });
  sc.appendChild(tp);
  sc.appendChild(el(`<div class="h2">Лига недели</div>`));
  const lw = el(`<div id="leagueWrap"></div>`);
  lw.innerHTML = leagueHTML();
  sc.appendChild(lw);
  const inv = $('#invite');
  if(inv) inv.onclick = ()=>{ try{ navigator.clipboard.writeText('impulse.app/club/friday-37'); }catch(e){} toast('Ссылка на клуб скопирована', 'good', '🔗'); };
}
function renderLeague(){ if($('#scr-social').classList.contains('active')) renderSocial(); }

/* ================= PROFILE ================= */
function accRing(){
  const total = S.wins + S.losses;
  const acc = total ? S.wins/total : 0;
  const R = 40, C = 2*Math.PI*R;
  return `<svg width="92" height="92" viewBox="0 0 92 92">
    <circle cx="46" cy="46" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/>
    ${total ? `<circle cx="46" cy="46" r="${R}" fill="none" stroke="#ffc24b" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${(acc*C).toFixed(1)} ${C.toFixed(1)}"/>` : ''}</svg>`;
}
function renderProfile(){
  const sc = $('#profScroll'); if(!sc) return;
  const mins = Math.max(1, Math.round((Date.now() - S.sessionStart)/60000));
  const total = S.wins + S.losses;
  const curTier = unlockedTiers();
  const nextTier = TIERS[Math.min(curTier, TIERS.length-1)];
  const prevXp = curTier>0 ? TIERS[curTier-1].xp : 0;
  const prog = curTier >= TIERS.length ? 100 : Math.min(100, (S.xp - prevXp)/(nextTier.xp - prevXp)*100);
  /* демо-подложка: сразу после ап-а реальный прогресс почти нулевой и линейка выглядит пустой */
  const progShow = curTier >= TIERS.length ? 100 : Math.max(50, prog);
  const limPct = Math.min(100, S.rgSpent / S.rgLimit * 100);
  sc.innerHTML = `
    <div class="panel">
      <div class="streakrow">
        <div><div class="flamebox">${accRing()}<div class="fl">🔥<span class="fn">${S.streak} дн</span></div></div>
          <div class="fmult">XP ${multTxt()}</div></div>
        <div style="flex:1">
          <div style="font-weight:800;font-size:16px">${esc(S.name || 'Гость')} ${S.name? '' : '<span class="mut" style="font-weight:600;font-size:11.5px">· профиль не создан</span>'}</div>
          <div class="mut" style="font-size:12px;margin-top:3px">заморозки стрика ❄️ ${S.freezes}</div>
        </div>
      </div>
      <div class="daychips">${Array.from({length:7},(_,i)=>{
        const d = i + 1, m = Math.min(2, 1 + 0.1 * (d - 1));
        const mt = '\u00d7' + String(Math.round(m * 10) / 10).replace('.', ',');
        return `<div class="dchip ${d === Math.min(S.streak, 7) ? 'on' : ''} ${d < S.streak ? 'past' : ''}"><b>${d}${'\u00A0'}день</b><span>${mt}</span></div>`;
      }).join('')}</div>
      <div class="mut" style="font-size:10.5px;margin-top:7px;text-align:center">Заходи чаще — получай больше опыта за задания</div>
      ${S.name ? '' : '<button class="ghost" id="regNow" style="margin-top:14px">Сохранить прогресс — создать профиль</button>'}
    </div>
    ${portfolioHTML()}
    <div class="h2" id="profBP">Сезонный пропуск <small>сезон «Осень» · 5 недель</small></div>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><b>Уровень ${Math.min(curTier + 1, TIERS.length)} · ${S.xp} XP</b><span class="mut">${curTier >= TIERS.length ? 'максимум сезона' : 'до награды: ' + (nextTier.xp - S.xp) + ' XP'}</span></div>
      <div class="bigbar"><i style="width:${progShow}%"></i></div>
      <div class="mut" style="font-size:11px;margin-bottom:4px">Бесплатная ветка</div>
      <div class="bp-track">${TIERS.map((t,i)=>{
        const un = S.xp >= t.xp, cl = S.claimed.includes(i);
        return `<div class="tier ${un?'unlocked':''} ${cl?'claimed':''}">
          <div class="ti">${t.ico}</div><div class="tn">${t.name}</div><div class="txp">${t.xp} XP</div>
          ${un && !cl ? `<button data-claim="${i}">Забрать</button>` : ''}</div>`;
      }).join('')}</div>
      <div class="mut" style="font-size:11px;margin:6px 0 4px">Платная ветка · 🔒 в прототипе закрыта</div>
      <div class="bp-track">${PREM.map((t,i)=>`<div class="tier prem"><span class="lock">🔒</span>
        <div class="ti">${t.split(' ')[0]}</div><div class="tn">${t.split(' ').slice(1).join(' ')}</div><div class="txp">${TIERS[i].xp} XP</div></div>`).join('')}</div>
    </div>

    <div class="h2">Квесты дня</div>
    <div class="panel" data-quests="1"><div class="rowline" style="border:none;padding:0 0 9px"><span class="mut" style="font-size:12px">Множитель опыта за стрик</span><b style="color:var(--amber)">XP ${multTxt()}</b></div><div class="qlist">${questHTML()}</div>
      <button class="ghost ci" id="ciProf" style="margin-top:4px">${S.checkedIn ? '✓ Капсула дня открыта' : '💊 Открыть капсулу дня'}</button></div>

    <div class="h2">Твоя неделя <small>играй осознанно</small></div>
    <div class="panel rg">
      <div style="font-size:14px;font-weight:800">🧭 Прозрачная статистика</div>
      <div class="rgstats">
        <div class="rgstat"><b>${mins} мин</b><span>в приложении</span></div>
        <div class="rgstat"><b>${S.betsToday}</b><span>ставок сегодня</span></div>
        <div class="rgstat"><b class="${S.pnl>=0?'posup':'posdn'}">${S.pnl>=0?'+':''}${fmt(S.pnl)}</b><span>итог недели</span></div>
      </div>
      <div style="font-size:12.5px;display:flex;justify-content:space-between;margin-bottom:8px"><span>RTP сессии <span class="mut" style="font-weight:600;font-size:11px">· целевой 95%</span></span><b>${(()=>{ const ow = S.positions.filter(p=>p.status==='open').reduce((a,p)=>a+p.stake,0); const base = S.wag - ow; return base > 0 ? Math.round(S.ret / base * 100) + '%' : '—'; })()}</b></div>
      <div style="font-size:12.5px;display:flex;justify-content:space-between"><span>Дневной лимит ставок</span><b id="limVal">${fmt(S.rgLimit)}</b></div>
      <div class="limitbar"><i style="width:${limPct}%"></i></div>
      <div class="mut" style="font-size:11px">потрачено ${fmt(S.rgSpent)} из ${fmt(S.rgLimit)}</div>
      <input type="range" id="limRange" min="500" max="5000" step="100" value="${S.rgLimit}" style="margin-top:8px">
      <button class="ghost" id="pauseBtn" style="margin-top:10px">${S.rgPaused ? '▶ Снять паузу' : '🌿 Пауза на неделю — стрик не сгорит'}</button>
    </div>

    <div class="panel">
      <div class="rowline"><span class="mut">⭐ Избранные события</span><b>${S.favs.length}</b></div>
      <div class="rowline"><span class="mut">❤️ Игры на полке</span><b>${S.likedGames.length}</b></div>
      <div class="rowline"><span class="mut">Слежу за прогнозистами</span><b>${S.follows.length}</b></div>
      <button class="ghost" id="oddsTgl" style="margin-top:10px">${S.oddsMode ? 'Вернуть проценты (сейчас: коэффициенты)' : 'Коэффициенты вместо процентов (для олдов)'}</button>
      <button class="ghost" id="resetBtn" style="margin-top:10px">Сбросить демо и пройти онбординг заново</button>
    </div>
    <div class="notice">Прототип «Импульс» v5 · все данные фейковые, баланс демонстрационный · целевой RTP демо-математики — 95%</div>`;
  sc.querySelectorAll('[data-claim]').forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.claim;
      if(S.claimed.includes(i)) return; // защита от дабл-клика
      S.claimed.push(i);
      if(i===0) S.freezes++;
      toast(`Награда получена: ${TIERS[i].name}`, 'good', TIERS[i].ico);
      confetti(); store.save(); renderProfile();
    };
  });
  sc.querySelectorAll('[data-cash]').forEach(b=>b.onclick = ()=>cashout(b.dataset.cash));
  sc.querySelectorAll('[data-share]').forEach(b=>b.onclick = ()=>shareWin(b.dataset.share));
  const rn = $('#regNow');
  if(rn) rn.onclick = openRegSheet;
  const pr2 = $('#portReg');
  if(pr2) pr2.onclick = openRegSheet;
  const ci = $('#ciProf');
  if(ci) ci.onclick = openCapsule;
  const lr = $('#limRange');
  lr.oninput = ()=>{ $('#limVal').textContent = fmt(+lr.value); };
  lr.onchange = ()=>{ S.rgLimit = +lr.value; store.save(); renderProfile(); toast('Лимит обновлён', 'good', '🧭'); };
  $('#pauseBtn').onclick = ()=>{
    S.rgPaused = !S.rgPaused; store.save(); renderProfile();
    toast(S.rgPaused ? 'Пауза включена. Лента останется, ставки — нет' : 'Пауза снята', '', '🌿');
  };
  const ot = $('#oddsTgl');
  if(ot) ot.onclick = ()=>{
    S.oddsMode = !S.oddsMode; store.save();
    seedFeed(); favsDirty = true; renderProfile();
    toast(S.oddsMode ? 'Исходы показываются коэффициентами' : 'Исходы показываются процентами', 'good', '％');
  };
  $('#resetBtn').onclick = ()=>{ store.clear(); location.reload(); };
}

/* ================= NAV ================= */
$$('.nav button').forEach(b=>{
  b.onclick = ()=>{
    $$('.nav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');

    if(b.dataset.scr==='bets') renderBets();
    if(b.dataset.scr==='social') renderSocial();
    if(b.dataset.scr==='prof') renderProfile();
  };
});

/* ================= ONBOARDING ================= */
const ONB_SPORTS = ['киберспорт','футбол','теннис','баскетбол','хоккей','UFC'];
const ONB_FMT = [
  ['fast','⚡ Быстрые раунды · краш и мини-игры','казино'],
  ['slots','🎰 Слоты и каскады','казино'],
  ['sport','⚽ Ставки на спорт','футбол'],
  ['pred','🔮 Прогнозы на события','прогнозы'],
  ['social','👥 Вместе с другими · клубы и прогнозисты','социальное'],
];
const ONB_COMPS = [['ЛЧ','футбол'],['АПЛ','футбол'],['NBA','баскетбол'],['NHL','хоккей'],['Dota 2','киберспорт'],['CS2','киберспорт'],['UFC','UFC'],['Большой шлем','теннис']];
function renderOnb(){
  const onb = $('#onb');
  if(S.onboarded){ onb.style.display = 'none'; return; }
  onb.innerHTML = `
    <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
    <div class="onb-step active" data-step="0">
      <div class="onb-k">шаг 1 · один тап</div>
      <div class="onb-h">Ставил раньше на спорт или играл в онлайн-казино?</div>
      <div class="onb-p">От ответа зависит, с чего начнём. Сложные форматы — рынки предсказаний, пулы — откроются по мере прогресса, а не свалятся сразу.</div>
      <div class="expgrid">
        <button class="expcard" data-exp="1"><span class="xi">🎯</span><b>Да, опыт есть</b><span>матчи и коэффициенты знакомы — миксуем со ставками</span></button>
        <button class="expcard" data-exp="0"><span class="xi">🌱</span><b>Нет, я новенький</b><span>начнём с мини-игр — самого наглядного формата</span></button>
      </div>
      <div class="onb-foot"><button class="onb-skip" id="skipAll">Пропустить всё — лента разберётся сама</button></div>
    </div>
    <div class="onb-step" data-step="1">
      <div class="onb-k">шаг 2 · что больше заходит</div>
      <div class="onb-h">Какие форматы попробуем первыми?</div>
      <div class="onb-p">Можно несколько. Темы и турниры уточним, только если выберешь ставки или прогнозы, — остальным этот вопрос не нужен.</div>
      <div class="tags">${ONB_FMT.map(f=>`<button class="tagbtn" data-fmt="${f[0]}" data-tag="${f[2]}">${f[1]}</button>`).join('')}</div>
      <div class="onb-foot"><button class="playbtn" id="fmtNext">Дальше</button></div>
    </div>
    <div class="onb-step" data-step="2">
      <div class="onb-k">шаг 3 · уточняем темы</div>
      <div class="onb-h">Что тебе интересно смотреть и прогнозировать?</div>
      <div class="onb-p">Как в музыкальных сервисах: пара тапов — и лента тёплая с первого экрана. Без регистрации и депозита.</div>
      <div class="tags">${ONB_SPORTS.map(s=>`<button class="tagbtn" data-sport="${s}">${s}</button>`).join('')}</div>
      <div class="onb-foot"><button class="playbtn" data-next="3">Дальше</button></div>
    </div>
    <div class="onb-step" data-step="3">
      <div class="onb-k">шаг 4 · последний</div>
      <div class="onb-h">Турниры и сюжеты, за которыми следишь</div>
      <div class="onb-p">Начнёшь с балансом 10 000 ◈. Регистрация — только в момент ценности, не раньше.</div>
      <div class="tags">${ONB_COMPS.map(c=>`<button class="tagbtn" data-comp="${c[0]}" data-map="${c[1]}">${c[0]}</button>`).join('')}</div>
      <div class="onb-foot"><button class="playbtn" id="onbGo">Собрать мою ленту ⚡</button></div>
    </div>`;
  onb.style.display = 'flex';
  onb.querySelectorAll('.tagbtn').forEach(t=>t.onclick = ()=>t.classList.toggle('sel'));
  const goStep = n=>{
    onb.querySelectorAll('.onb-step').forEach(s=>s.classList.toggle('active', +s.dataset.step === n));
    onb.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on', i<=n));
  };
  onb.querySelectorAll('[data-next]').forEach(b=>{ b.onclick = ()=>goStep(+b.dataset.next); });
  onb.querySelectorAll('.expcard').forEach(c=>c.onclick = ()=>{
    S.exp = c.dataset.exp === '1';
    onb.querySelectorAll('.expcard').forEach(x=>x.classList.toggle('sel', x===c));
    setTimeout(()=>goStep(1), 260);
  });
  const collect = ()=>{
    const fmts = [...onb.querySelectorAll('[data-fmt].sel')].map(b=>b.dataset.fmt);
    const vmap = { fast:'казино', slots:'казино', sport:'спорт', pred:'прогнозы', social:'социальное' };
    S.interests.verts = [...new Set(fmts.map(f=>vmap[f]))];
    S.fastPref = fmts.includes('fast');
    S.interests.sports = [...onb.querySelectorAll('[data-sport].sel')].map(b=>b.dataset.sport);
    S.interests.comps = [...onb.querySelectorAll('[data-comp].sel')].map(b=>b.dataset.comp);
    S.interests.sports.forEach(s=>bump(s, 6));
    [...onb.querySelectorAll('[data-comp].sel')].forEach(b=>bump(b.dataset.map, 3));
    [...onb.querySelectorAll('[data-fmt].sel')].forEach(b=>bump(b.dataset.tag, 4));
    if(S.exp === null) S.exp = true;
    S.onboarded = true;
  };
  /* reward-экран: прогрессия начинается в онбординге, а не после него */
  const showReward = ()=>{
    S.xp += 50;
    store.save(); syncTop();
    onb.innerHTML = `<div class="onb-step active" data-step="4">
      <div class="onb-k">готово · ты уже в плюсе</div>
      <div class="onb-h" style="font-size:24px">+50 XP за настройку</div>
      <div class="onb-p">Это очки сезонного пропуска. Всё, что ты делаешь — прогнозы, игры, даже лайки, — двигает прогресс.</div>
      <div class="rwbox">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800"><span>🎫 Сезонный пропуск</span><span>50 / ${TIERS[0].xp} XP</span></div>
        <div class="rwbar"><i></i></div>
        <div class="notice" style="text-align:left">до первой награды (${TIERS[0].ico} ${TIERS[0].name}) — ${TIERS[0].xp - 50} XP</div>
      </div>
      <div class="rwcaps shake" id="rwCaps">
        <div class="ch ct2"></div><div class="ch cb2"></div>
        <div class="cp2"><span class="pi2"></span><small class="pt2" style="font-size:10px;font-weight:800"></small></div>
      </div>
      <div class="onb-p" style="font-weight:700" id="rwHint">А это капсула за первый визит — тапни 👆</div>
      <div class="rwdaily">📅 квесты дня и 🔥 стрик дают XP ежедневно · 💊 капсула ждёт раз в день</div>
      <div class="onb-foot"><button class="playbtn" id="rwGo" disabled>Сначала открой капсулу</button></div>
    </div>`;
    setTimeout(()=>{ const b = onb.querySelector('.rwbar i'); if(b) b.style.width = (50/TIERS[0].xp*100)+'%'; }, 180);
    const caps = $('#rwCaps');
    caps.onclick = ()=>{
      if(caps.classList.contains('opened')) return;
      caps.classList.remove('shake'); caps.classList.add('opened');
      caps.querySelector('.ct2').style.transform = 'translateY(-40px) rotate(-10deg)';
      caps.querySelector('.cb2').style.transform = 'translateY(40px) rotate(8deg)';
      const p = pick([['❄️','заморозка стрика'],['🎟️','фрибет ◈50 (демо)'],['🎰','5 демо-спинов'],['🎨','стикер в коллекцию']]);
      if(p[0] === '❄️') S.freezes++;
      caps.querySelector('.pi2').textContent = p[0];
      caps.querySelector('.pt2').textContent = p[1];
      caps.querySelector('.cp2').style.opacity = 1;
      $('#rwHint').textContent = 'Выпало: ' + p[1];
      const go = $('#rwGo'); go.disabled = false; go.textContent = 'В ленту ⚡';
      confetti(); store.save();
    };
    $('#rwGo').onclick = ()=>{
      if($('#rwGo').disabled) return;
      onb.style.transition = 'opacity .4s'; onb.style.opacity = 0;
      setTimeout(()=>{ onb.style.display = 'none'; }, 400);
      seedFeed();
      toast(S.interests.sports.length ? `Лента собрана: ${S.interests.sports.slice(0,3).join(', ')}` : 'Лента собрана — учусь на твоих действиях', 'brain', '🧠');
    };
  };
  $('#fmtNext').onclick = ()=>{
    const fmts = [...onb.querySelectorAll('[data-fmt].sel')].map(b=>b.dataset.fmt);
    if(fmts.includes('sport') || fmts.includes('pred')) goStep(2);
    else { onb.querySelectorAll('.dots i').forEach(d=>d.classList.add('on')); collect(); showReward(); }
  };
  $('#onbGo').onclick = ()=>{ collect(); showReward(); };
  $('#skipAll').onclick = ()=>{ collect(); showReward(); };
}

/* ================= INIT ================= */
/* восстановление после перезагрузки: таймеры резолва живут в памяти и теряются */
S.positions.forEach(p=>{
  if(p.status === 'open') setTimeout(()=>resolvePos(p.id), rnd(25000, 70000));
});
/* пул: если вступил, а позиция не успела создаться до перезагрузки — досоздаём */
if(S.pool.joined && !S.positions.some(p=>p.type === 'pool')){
  S.positions.unshift({
    id: 'pool' + Date.now(), type: 'pool',
    title: 'Пул клуба «Пятница»: экспресс ×11,7', side: 'доля ¼ · банк ◈400',
    stake: 100, prob: 8, curProb: 8, hist: [8],
    pay: 1172, status: 'open', t: Date.now(), undone: false,
  });
  setTimeout(()=>resolvePos(S.positions[0].id), rnd(40000, 90000));
  store.save();
}
clockTick(); syncTop(); renderBell();
renderOnb();
if(S.onboarded) seedFeed();
renderProfile(); renderPortfolio(); renderLeague();
setInterval(()=>{ if($('#scr-prof').classList.contains('active')) renderProfile(); }, 30000);
</script>
